<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>אישור הגעה | EventPilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- Frank Ruhl Libre: גופן עם סריפים לשם האירוע בלבד, כמו בהזמנה מודפסת -->
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="rsvp-page">

  <!-- עמוד זה נפרד מממשק הניהול: אין בו תפריט ואין צורך בהתחברות -->
  <header class="auth-header">
    <p class="brand"><img class="brand-logo" src="img/logo.svg" alt="">EventPilot</p>
  </header>

  <main class="auth-card card invitation">

    <!-- מצב 1: הקישור לא תקף -->
    <section id="invalid-section" hidden>
      <h1>הקישור אינו תקף</h1>
      <p>לא מצאנו הזמנה שמתאימה לקישור הזה. בדקו שהעתקתם את הקישור במלואו, או בקשו מהמארגן קישור חדש.</p>
    </section>

    <!-- מצב 2: טופס אישור ההגעה -->
    <section id="form-section" hidden>
      <!-- ראש ההזמנה: סמל, שם האירוע, תאריך ומקום -->
      <div class="invite-head">
        <span class="invite-emblem"><span data-icon="heart"></span></span>
        <p>הוזמנתם לאירוע</p>
        <h1 id="event-title" class="invite-title"></h1>
        <p id="event-info" class="invite-info"></p>
      </div>
      <p id="greeting"></p>

      <p id="closed-message" class="message warning" hidden></p>
      <p id="current-answer" class="message success" hidden></p>
      <p id="form-message" class="message error" role="alert" hidden></p>

      <form id="rsvp-form" novalidate>
        <fieldset class="field">
          <legend>האם תגיעו?</legend>
          <!-- כפתורי הבחירה הם כפתורי רדיו רגילים, שה-CSS מציג כאריחים גדולים -->
          <div class="choice-group answer-tiles">
            <label class="choice answer-yes">
              <input type="radio" name="answer" id="answer-yes" value="attending">
              <span data-icon="smile"></span>
              <span>מגיעים</span>
            </label>
            <label class="choice answer-no">
              <input type="radio" name="answer" id="answer-no" value="declined">
              <span data-icon="cancel"></span>
              <span>לא מגיעים</span>
            </label>
          </div>
          <small class="field-error"></small>
        </fieldset>

        <!-- מוצג רק כשבוחרים "מגיעים" -->
        <div class="field" id="count-field" hidden>
          <label for="guest-count">כמה תגיעו?</label>
          <!-- כפתורי פלוס ומינוס סביב השדה. אפשר גם להקליד מספר ישירות -->
          <div class="stepper">
            <button type="button" id="count-minus" class="stepper-button" aria-label="פחות משתתפים"><span data-icon="minus"></span></button>
            <input type="number" id="guest-count" min="1" step="1" inputmode="numeric">
            <button type="button" id="count-plus" class="stepper-button" aria-label="יותר משתתפים"><span data-icon="plus"></span></button>
          </div>
          <small class="field-error"></small>
          <small class="hint" id="count-hint"></small>
        </div>

        <div class="field">
          <label for="guest-note">הערה למארגן (לא חובה)</label>
          <textarea id="guest-note" rows="3" maxlength="200" placeholder="למשל: מנה צמחונית"></textarea>
          <small class="field-error"></small>
          <small class="hint" id="note-counter" dir="ltr">0 / 200</small>
        </div>

        <button type="submit" class="button primary full-width button-with-icon"><span data-icon="send"></span>שליחת התשובה</button>
      </form>
    </section>

    <!-- מצב 3: התשובה נשמרה -->
    <section id="result-section" aria-live="polite" hidden>
      <span class="invite-emblem result-emblem"><span data-icon="check"></span></span>
      <h1 id="result-title"></h1>
      <p id="result-text"></p>
      <dl id="result-details" class="details-list"></dl>
      <button type="button" id="change-answer-button" class="button ghost full-width">שינוי התשובה</button>
    </section>
  </main>

  <footer class="site-footer">
    <p>EventPilot · פרויקט בקורס בניית מערכות מבוססות Web</p>
  </footer>

  <script src="js/storage.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/common.js"></script>
  <script src="js/rsvp.js"></script>
</body>
</html>
