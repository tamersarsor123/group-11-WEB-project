<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="EventPilot">
  <!-- הלוגו של EventPilot: מעטפת הזמנה מוטה מעט, עם דש כחול ולב אדום כחותם -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f2eadc"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a74a6"/>
      <stop offset="1" stop-color="#2b4a72"/>
    </linearGradient>
    <radialGradient id="seal" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#f26b5e"/>
      <stop offset="1" stop-color="#c8342b"/>
    </radialGradient>
  </defs>
  <!-- הטיה קלה, כאילו ההזמנה הונחה על השולחן -->
  <g transform="rotate(-8 16 16)">
    <!-- גוף המעטפה -->
    <rect x="2.5" y="8" width="27" height="18" rx="2.5" fill="url(#paper)" stroke="#2b4a72" stroke-width="1.4"/>
    <!-- הדש הסגור, בכחול -->
    <path d="M4 8.4h24l-12 9.6z" fill="url(#flap)" stroke="#2b4a72" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- הלב האדום כחותם בקצה הדש, עם מסגרת לבנה וברק קטן -->
    <path d="M16 22.4c0 0-3.7-2.3-3.7-4.7 0-1.1.9-2 2-2 .7 0 1.3.4 1.7 1 .4-.6 1-1 1.7-1 1.1 0 2 .9 2 2 0 2.4-3.7 4.7-3.7 4.7z" fill="url(#seal)" stroke="#ffffff" stroke-width="0.9" stroke-linejoin="round"/>
    <circle cx="14.5" cy="17.6" r="0.55" fill="#ffffff" opacity="0.75"/>
  </g>
</svg>
