<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="EventPilot">
  <!-- הלוגו של EventPilot: מעטפת הזמנה סגורה, ועליה לב קטן כמו חותם -->
  <!-- גוף המעטפה: שמנת עם מסגרת כחולה, כדי שייראה גם על רקע כהה וגם על רקע בהיר -->
  <rect x="2.5" y="7" width="27" height="19" rx="2.5" fill="#fdfbf7" stroke="#2b4a72" stroke-width="1.5"/>
  <!-- הדש הסגור: משולש מהפינות העליונות אל מרכז המעטפה -->
  <path d="M3.4 8.1 16 17.4 28.6 8.1" fill="#f1ebdf" stroke="#2b4a72" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- לב קטן בקצה הדש, כמו חותם על הזמנה -->
  <path d="M16 19.4c0 0-2.3-1.4-2.3-2.9 0-.7.6-1.3 1.3-1.3.4 0 .8.2 1 .6.2-.4.6-.6 1-.6.7 0 1.3.6 1.3 1.3 0 1.5-2.3 2.9-2.3 2.9z" fill="#c8a25e"/>
</svg>
