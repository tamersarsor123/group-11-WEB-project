<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="EventPilot">
  <!-- הלוגו של EventPilot: מעטפת הזמנה שהדש שלה הוא לב -->
  <!-- גוף המעטפה: שמנת עם מסגרת כחולה, כדי שייראה גם על רקע כהה וגם על רקע בהיר -->
  <rect x="2.5" y="10" width="27" height="18" rx="3" fill="#fdfbf7" stroke="#2b4a72" stroke-width="1.5"/>
  <!-- קווי הקיפול: הדש העליון יורד מהפינות אל חוד הלב, והקפלים התחתונים עולים מהפינות -->
  <path d="M3.8 11.2 16 20.3M28.2 11.2 16 20.3M4 26.8 12.8 19.8M28 26.8 19.2 19.8" fill="none" stroke="#2b4a72" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <!-- הדש: לב זהב. החלק העליון בולט מעל המעטפה, והחוד יורד לתוכה כמו קצה של דש -->
  <path d="M16 20.5C16 20.5 6.8 14.9 6.8 10.6 6.8 8 8.7 6.1 11.2 6.1c2 0 3.8 1.2 4.8 3 1-1.8 2.8-3 4.8-3 2.5 0 4.4 1.9 4.4 4.5 0 4.3-9.2 9.9-9.2 9.9z" fill="#c8a25e" stroke="#a8843f" stroke-width="0.9" stroke-linejoin="round"/>
</svg>
